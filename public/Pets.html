<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animais · PetAdoption</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="/style/app.css">
</head>
<body>
  <main class="page">
    <div class="page-header">
      <div>
        <h1>Animais</h1>
        <p id="resumoLista">Animais disponíveis e já adotados.</p>
      </div>
      <a class="btn btn-primary" href="CadPet.html">
        <span class="material-icons" aria-hidden="true">add</span> Novo animal
      </a>
    </div>

    <div class="toolbar">
      <div class="search">
        <span class="material-icons" aria-hidden="true">search</span>
        <input type="search" id="busca" placeholder="Buscar por nome ou raça" aria-label="Buscar animais">
      </div>
      <select id="filtroEspecie" aria-label="Filtrar por espécie">
        <option value="">Todas as espécies</option>
      </select>
    </div>

    <h2 class="section-title">Disponíveis para adoção <span class="count-pill" id="contaDisponiveis">0</span></h2>
    <div id="listaPetsDisponiveis" class="grid"></div>

    <h2 class="section-title">Já adotados <span class="count-pill" id="contaAdotados">0</span></h2>
    <div id="listaPetsAdotados" class="grid"></div>
  </main>

  <script src="/js/app.js"></script>
  <script src="/js/validacao/listaPet.js"></script>
</body>
</html>
