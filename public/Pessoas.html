<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pessoas · PetAdoption</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="/style/app.css">
</head>
<body>
  <main class="page">
    <div class="page-header">
      <div>
        <h1>Pessoas</h1>
        <p id="resumoLista">Adotantes, voluntários e doadores.</p>
      </div>
      <a class="btn btn-primary" href="CadPessoa.html">
        <span class="material-icons" aria-hidden="true">person_add</span> Nova pessoa
      </a>
    </div>

    <div class="toolbar">
      <div class="search">
        <span class="material-icons" aria-hidden="true">search</span>
        <input type="search" id="busca" placeholder="Buscar por nome, CPF, e-mail ou cidade" aria-label="Buscar pessoas">
      </div>
      <select id="filtroCargo" aria-label="Filtrar por cargo">
        <option value="">Todos os cargos</option>
        <option value="adotante">Adotante</option>
        <option value="voluntario">Voluntário</option>
        <option value="doador">Doador</option>
        <option value="nenhum">Sem cargo</option>
      </select>
    </div>

    <div id="listaPessoas" class="table-wrap"></div>
  </main>

  <script src="/js/app.js"></script>
  <script src="/js/validacao/listaPessoas.js"></script>
</body>
</html>
