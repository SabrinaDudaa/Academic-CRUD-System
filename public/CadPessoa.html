<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de pessoa · PetAdoption</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="/style/app.css">
</head>
<body>
  <main class="page page-narrow">
    <div class="page-header">
      <div>
        <h1 id="titulo">Nova pessoa</h1>
        <p id="subtitulo">Preencha os dados e escolha os cargos.</p>
      </div>
    </div>

    <form id="formPessoa" class="card" novalidate>
      <div class="form-grid">
        <div class="form-section">Dados pessoais</div>

        <div class="field span-8">
          <label for="nomePessoa">Nome completo <span class="req">*</span></label>
          <input type="text" id="nomePessoa" name="nomePessoa" maxlength="100" autocomplete="name" required>
          <span class="error" data-erro="nomePessoa"></span>
        </div>
        <div class="field span-4">
          <label for="idade">Idade <span class="req">*</span></label>
          <input type="number" id="idade" name="idade" min="0" max="120" inputmode="numeric" required>
          <span class="error" data-erro="idade"></span>
        </div>

        <div class="field span-6">
          <label for="cpf">CPF <span class="req">*</span></label>
          <input type="text" id="cpf" name="cpf" inputmode="numeric" placeholder="000.000.000-00" required>
          <span class="error" data-erro="cpf"></span>
        </div>
        <div class="field span-6">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" maxlength="100" autocomplete="email" placeholder="nome@exemplo.com">
          <span class="error" data-erro="email"></span>
        </div>

        <div class="field span-6">
          <label for="telefone1">Telefone 1 <span class="req">*</span></label>
          <input type="tel" id="telefone1" name="telefone1" inputmode="tel" placeholder="(00) 00000-0000" required>
          <span class="error" data-erro="telefone1"></span>
        </div>
        <div class="field span-6">
          <label for="telefone2">Telefone 2</label>
          <input type="tel" id="telefone2" name="telefone2" inputmode="tel" placeholder="(00) 00000-0000">
        </div>

        <div class="form-section">Endereço</div>

        <div class="field span-4">
          <label for="cep">CEP</label>
          <input type="text" id="cep" name="cep" inputmode="numeric" placeholder="00000-000">
        </div>
        <div class="field span-8">
          <label for="rua">Endereço <span class="req">*</span></label>
          <input type="text" id="rua" name="rua" maxlength="100" placeholder="Rua, número" required>
          <span class="error" data-erro="rua"></span>
        </div>
        <div class="field span-5">
          <label for="bairro">Bairro <span class="req">*</span></label>
          <input type="text" id="bairro" name="bairro" maxlength="50" required>
          <span class="error" data-erro="bairro"></span>
        </div>
        <div class="field span-5 cidade">
          <label for="cidade">Cidade <span class="req">*</span></label>
          <input type="text" id="cidade" name="cidade" maxlength="100" required>
          <span class="error" data-erro="cidade"></span>
        </div>
        <div class="field span-2">
          <label for="uf">UF <span class="req">*</span></label>
          <input type="text" id="uf" name="uf" maxlength="2" placeholder="ES" required>
          <span class="error" data-erro="uf"></span>
        </div>

        <div class="form-section">Cargos</div>

        <div class="field">
          <div class="chips" role="group" aria-label="Cargos da pessoa">
            <label class="chip"><input type="checkbox" name="tipoPessoa[]" value="adotante" checked><span>Adotante</span></label>
            <label class="chip"><input type="checkbox" name="tipoPessoa[]" value="voluntario"><span>Voluntário</span></label>
            <label class="chip"><input type="checkbox" name="tipoPessoa[]" value="doador"><span>Doador</span></label>
          </div>
          <span class="hint">Uma pessoa pode ter mais de um cargo.</span>
        </div>

        <div class="form-actions">
          <a class="btn btn-secondary" href="Pessoas.html">Cancelar</a>
          <button class="btn btn-primary" type="submit" id="salvar">
            <span class="material-icons" aria-hidden="true">save</span> Salvar
          </button>
        </div>
      </div>
    </form>
  </main>

  <script src="/js/app.js"></script>
  <script src="/js/validacao/enviaPessoa.js"></script>
</body>
</html>
