<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel · PetAdoption</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="/style/app.css">
</head>
<body>
  <main class="page">
    <div class="page-header">
      <div>
        <h1>Painel</h1>
        <p>Visão geral das pessoas, dos animais e das adoções.</p>
      </div>
      <a class="btn btn-primary" href="Adocao.html">
        <span class="material-icons" aria-hidden="true">volunteer_activism</span> Nova adoção
      </a>
    </div>

    <section class="stats" id="stats" aria-label="Totais">
      <div class="stat">
        <span class="avatar"><span class="material-icons" aria-hidden="true">people</span></span>
        <div><div class="stat-value" data-stat="pessoas">–</div><div class="stat-label">Pessoas cadastradas</div></div>
      </div>
      <div class="stat">
        <span class="avatar"><span class="material-icons" aria-hidden="true">pets</span></span>
        <div><div class="stat-value" data-stat="pets">–</div><div class="stat-label">Animais cadastrados</div></div>
      </div>
      <div class="stat">
        <span class="avatar"><span class="material-icons" aria-hidden="true">home</span></span>
        <div><div class="stat-value" data-stat="disponiveis">–</div><div class="stat-label">Aguardando adoção</div></div>
      </div>
      <div class="stat">
        <span class="avatar adopted"><span class="material-icons" aria-hidden="true">favorite</span></span>
        <div><div class="stat-value" data-stat="adotados">–</div><div class="stat-label">Já adotados</div></div>
      </div>
    </section>

    <section class="charts">
      <div class="card chart-box">
        <h2>Pessoas por cargo</h2>
        <div class="chart-holder"><canvas id="graficoPessoas" aria-label="Gráfico de pessoas por cargo" role="img"></canvas></div>
      </div>
      <div class="card chart-box">
        <h2>Animais por espécie</h2>
        <div class="chart-holder"><canvas id="graficoPets" aria-label="Gráfico de animais por espécie" role="img"></canvas></div>
      </div>
    </section>

    <h2 class="section-title">Últimas adoções</h2>
    <div class="table-wrap" id="ultimasAdocoes"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/Cadastros/Dashboard.js"></script>
</body>
</html>
