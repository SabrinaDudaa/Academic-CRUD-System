<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de animal · PetAdoption</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="/style/app.css">
</head>
<body>
  <main class="page page-narrow">
    <div class="page-header">
      <div>
        <h1 id="titulo">Novo animal</h1>
        <p id="subtitulo">Preencha os dados do animal.</p>
      </div>
    </div>

    <form id="formPet" class="card" novalidate>
      <div class="form-grid">
        <div class="field span-8">
          <label for="nomePet">Nome <span class="req">*</span></label>
          <input type="text" id="nomePet" name="nomePet" maxlength="100" required>
          <span class="error" data-erro="nomePet"></span>
        </div>
        <div class="field span-4">
          <label for="idadePet">Idade (anos) <span class="req">*</span></label>
          <input type="number" id="idadePet" name="idadePet" min="0" max="60" inputmode="numeric" required>
          <span class="error" data-erro="idadePet"></span>
        </div>

        <div class="field span-6">
          <label for="especiePet">Espécie <span class="req">*</span></label>
          <input type="text" id="especiePet" name="especiePet" maxlength="100" list="especies" placeholder="Ex.: Cachorro" required>
          <datalist id="especies">
            <option value="Cachorro"></option>
            <option value="Gato"></option>
          </datalist>
          <span class="error" data-erro="especiePet"></span>
        </div>
        <div class="field span-6">
          <label for="racaPet">Raça <span class="req">*</span></label>
          <input type="text" id="racaPet" name="racaPet" maxlength="100" placeholder="Ex.: Vira-lata" required>
          <span class="error" data-erro="racaPet"></span>
        </div>

        <div class="field span-6">
          <label for="dataChegada">Data de chegada <span class="req">*</span></label>
          <input type="date" id="dataChegada" name="dataChegada" required>
          <span class="error" data-erro="dataChegada"></span>
        </div>

        <div class="form-actions">
          <a class="btn btn-secondary" href="Pets.html">Cancelar</a>
          <button class="btn btn-primary" type="submit" id="salvar">
            <span class="material-icons" aria-hidden="true">save</span> Salvar
          </button>
        </div>
      </div>
    </form>
  </main>

  <script src="/js/app.js"></script>
  <script src="/js/validacao/enviaPet.js"></script>
</body>
</html>
